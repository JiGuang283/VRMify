name: Build ModelConvert

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release New version"
        required: false
        type: string
        default: ""

  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            arch_name: windows-x64
          - label: Windows ARM
            os: windows-11-arm
            arch_name: windows-arm64
          - label: macOS Intel
            os: macos-15-intel
            arch_name: macos-x64
          - label: macOS ARM
            os: macos-latest
            arch_name: macos-arm64
          - label: Linux x64
            os: ubuntu-latest
            arch_name: linux-x64
          - label: Linux ARM
            os: ubuntu-24.04-arm
            arch_name: linux-arm64

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Main
        uses: actions/checkout@v5

      # ---- 产物名消毒（2026-10-02 加）--------------------------------
      # release_tag 是手填的输入框，很容易把「版本号 + 更新说明」整句粘进去。
      # 一旦里面出现冒号 : 就会连环炸：
      #   * Windows：PowerShell 把 "ModelConvert-v1.1.5: xxx" 里的 "v1.1.5:" 当成
      #     盘符，Compress-Archive 直接报错退出（run #5 就是这样）；
      #   * macOS / Linux：文件名合法、压缩能过，但 actions/upload-artifact
      #     明确禁止产物名含 : " < > | * ? \ / 和换行，上传步骤失败。
      # 这里统一算出一个只含 [A-Za-z0-9._-] 的安全值，专供产物名 / 文件名使用；
      # 真正用于发布 Release 的 tag 仍然是原始值，不受影响。
      - name: Resolve artifact tag
        id: rel
        shell: bash
        env:
          RAW_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          safe=$(printf '%s' "$RAW_TAG" \
            | tr -c 'A-Za-z0-9._-' '-' \
            | sed -e 's/-\{2,\}/-/g' -e 's/^[-.]*//' -e 's/[-.]*$//')
          if [ -z "$safe" ]; then safe="build-${GITHUB_RUN_NUMBER}"; fi
          printf 'raw  = %s\n' "$RAW_TAG"
          printf 'safe = %s\n' "$safe"
          echo "tag=$safe" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build with PyInstaller
        run: |
          pyinstaller main.spec --noconfirm

      # 把 READMETXT/ 下的多语言说明 txt 放进产物根目录：
      # Windows / Linux → dist/ModelConvert/（与 exe 同级）；
      # macOS → .app 旁边（不写进 .app 内部，避免破坏其临时签名）。
      - name: Bundle README txt files
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp READMETXT/*.txt dist/
          else
            cp READMETXT/*.txt dist/ModelConvert/
          fi

      - name: Archive artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive `
            -Path dist/ModelConvert `
            -DestinationPath "ModelConvert-${{ steps.rel.outputs.tag }}-${{ matrix.arch_name }}.zip"

      - name: Archive artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r "../ModelConvert-${{ steps.rel.outputs.tag }}-${{ matrix.arch_name }}.zip" ModelConvert

      - name: Archive artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y "../ModelConvert-${{ steps.rel.outputs.tag }}-${{ matrix.arch_name }}.zip" ModelConvert.app *.txt

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: ModelConvert-${{ steps.rel.outputs.tag }}-${{ matrix.arch_name }}
          path: ModelConvert-${{ steps.rel.outputs.tag }}-${{ matrix.arch_name }}.zip
          if-no-files-found: error

  release:
    name: Release
    needs: build

    if: >
      github.ref_type == 'tag' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.release_tag != ''
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # release job 原来没有 checkout，工作区里没有 .git —— gh CLI 靠 git remote
      # 推断「当前是哪个仓库」，没有 .git 就会直接退出码 1。补上 checkout，
      # 下面 gh 的调用再加 --repo 双保险。
      - name: Checkout Main
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      # ========================================
      # 正常 Tag 发布
      # ========================================
      - name: Create or update Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/*.zip

          # 第一次创建时保持 Draft
          # 发布前可以到 GitHub Release 页面检查
          draft: true

          generate_release_notes: true

          prerelease: false

          # 明确指定：同名文件覆盖
          overwrite_files: true

          # 下载表格放在最上面，自动生成的 changelog 追加在后面
          append_body: false
          body: |
            ## DownLoad

            | Platform | Architecture | File |
            |------|------|------|
            | **Windows** | x64 | [ModelConvert-${{ github.ref_name }}-windows-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ModelConvert-${{ github.ref_name }}-windows-x64.zip) |
            | **Windows** | ARM64 | [ModelConvert-${{ github.ref_name }}-windows-arm64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ModelConvert-${{ github.ref_name }}-windows-arm64.zip) |
            | **macOS** | Intel (x64) | [ModelConvert-${{ github.ref_name }}-macos-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ModelConvert-${{ github.ref_name }}-macos-x64.zip) |
            | **macOS** | Apple Silicon (ARM64) | [ModelConvert-${{ github.ref_name }}-macos-arm64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ModelConvert-${{ github.ref_name }}-macos-arm64.zip) |
            | **Linux** | x64 | [ModelConvert-${{ github.ref_name }}-linux-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ModelConvert-${{ github.ref_name }}-linux-x64.zip) |
            | **Linux** | ARM64 | [ModelConvert-${{ github.ref_name }}-linux-arm64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ModelConvert-${{ github.ref_name }}-linux-arm64.zip) |

            > Windows users choose x64 (most computers), while macOS users choose ARM64 (M1/M2/M3 chips).
            > Windows 用户选 x64（绝大多数电脑），macOS 用户选 ARM64（M1/M2/M3 芯片）。
            > Windows 用戶選 x64（絕大多數電腦），macOS 用戶選 ARM64（M1/M2/M3 芯片）。
            > Windows ユーザーは x64 (ほとんどのコンピュータ) を选択し、macOS ユーザーは ARM64 (M1/M2/M3 チップ) を选択します。

      # ========================================
      # 手动更新已有 Release
      # ========================================
      # 加 github.ref_type != 'tag'：在 tag ref 上手动触发时，上面那步（按
      # github.ref_name 建/更新 Release）已经会跑，这里再跑一次会拿
      # inputs.release_tag 去 upload，两边动同一个 Release、互相打架。互斥更清楚。
      - name: Update existing Release
        if: >
          github.ref_type != 'tag' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ inputs.release_tag }}" \
            release-artifacts/*.zip \
            --repo "${{ github.repository }}" \
            --clobber

      # 新增：把手动填的 release_tag 也写进下载表格
      - name: Update Release description
        if: >
          github.ref_type != 'tag' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          # 与 build job 完全一致的消毒逻辑
          safe=$(printf '%s' "$RELEASE_TAG" \
            | tr -c 'A-Za-z0-9._-' '-' \
            | sed -e 's/-\{2,\}/-/g' -e 's/^[-.]*//' -e 's/[-.]*$//')
          if [ -z "$safe" ]; then safe="build-${GITHUB_RUN_NUMBER}"; fi

          cat > /tmp/body.md <<EOF
          ## DownLoad

          | Platform | Architecture | File |
          |------|------|------|
          | **Windows** | x64 | [ModelConvert-${safe}-windows-x64.zip](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/ModelConvert-${safe}-windows-x64.zip) |
          | **Windows** | ARM64 | [ModelConvert-${safe}-windows-arm64.zip](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/ModelConvert-${safe}-windows-arm64.zip) |
          | **macOS** | Intel (x64) | [ModelConvert-${safe}-macos-x64.zip](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/ModelConvert-${safe}-macos-x64.zip) |
          | **macOS** | Apple Silicon (ARM64) | [ModelConvert-${safe}-macos-arm64.zip](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/ModelConvert-${safe}-macos-arm64.zip) |
          | **Linux** | x64 | [ModelConvert-${safe}-linux-x64.zip](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/ModelConvert-${safe}-linux-x64.zip) |
          | **Linux** | ARM64 | [ModelConvert-${safe}-linux-arm64.zip](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/ModelConvert-${safe}-linux-arm64.zip) |

          > Windows: x64 (most computers) · macOS: ARM64 (M1/M2/M3)
          > Windows：x64（绝大多数电脑） · macOS：ARM64（M1/M2/M3）
          > Windows：x64（絕大多數電腦） · macOS：ARM64（M1/M2/M3）
          > Windows：x64（ほとんどのコンピュータ） · macOS：ARM64（M1/M2/M3）
          EOF

          gh release edit "$RELEASE_TAG" \
            --repo "$REPO" \
            --notes-file /tmp/body.md