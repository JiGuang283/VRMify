# 打 v* tag 时：测试 → 打包 Windows 绿色版 zip → 冒烟测试（tools/smoke_exe.py）→ 建一个草稿 Release（确认后在网页上点发布）。
# 手动运行（workflow_dispatch）只打包，zip 在这次运行的 Artifacts 里，不建 Release。
#
#   改 ui/version.py → 提交 → git tag v0.1.0 → git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests
      - name: Build
        id: build
        shell: pwsh
        run: |
          $expect = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "" }
          python tools/build_release.py --expect-version "$expect"
      # 打包后的 exe 实际跑一遍：启动、转换合成的 PMX / zip / FBX / unitypackage、校验输出（不过就不建 Release）
      - name: Smoke test
        run: python tools/smoke_exe.py "${{ steps.build.outputs.zip }}"
      # 直接上传 zip 本身（archive: false），下载下来不会是「zip 套 zip」
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.zip }}
          archive: false
      - name: Draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.build.outputs.zip }}" --draft `
            --title "VRMify ${{ github.ref_name }}" --generate-notes
